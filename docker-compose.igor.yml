services:
  sparkdash:
    build:
      context: .
      dockerfile: Dockerfile
      # NOTE: no `platforms:` pin — igor is x86_64, not a Spark. node:22-bookworm-slim
      # is multi-arch so this builds natively here.
    container_name: sparkDash
    restart: unless-stopped
    command: ["node", "--watch", "server/index.js"]
    ports:
      - "5555:5555"
    # NOTE: upstream runs privileged + pid:host + nvidia-smi/driver mounts because it
    # expects to run ON a Spark and read local GPU metrics. igor has no GPU and monitors
    # ltd-1/2/3 REMOTELY over SSH, so all of that is dropped on purpose.
    volumes:
      - ./server:/app/server
      # DecodeBench / Showcase import src/shared (1.8.0+)
      - ./src/shared:/app/src/shared:ro
      - ./config:/app/config
      # read-only SSH key so the container can reach the Sparks as prescott
      - /home/prescott/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /home/prescott/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      # 1.8.2+ defaults to 127.0.0.1; published 5555:5555 needs 0.0.0.0
      - BIND_HOST=0.0.0.0
      - PORT=5555
      - NODE_ENV=production
      # Spark serve port (bert overrides via llmPorts). igor's :8888 is searxng.
      - LLM_PORT=8888
    networks:
      - sparkdash-net

networks:
  sparkdash-net:
    driver: bridge
